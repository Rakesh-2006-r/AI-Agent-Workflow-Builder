table:
  name: organizations
  schema: public
array_relationships:
- name: org_members
  using:
    foreign_key_constraint_on:
      column: org_id
      table:
        name: org_members
        schema: public
select_permissions:
- role: user
  permission:
    columns:
    - id
    - name
    - usage_quota
    - usage_count
    - created_at
    filter:
      org_members:
        user_id:
          _eq: X-Hasura-User-Id
update_permissions:
- role: user
  permission:
    columns:
    - name
    filter:
      org_members:
        user_id:
          _eq: X-Hasura-User-Id
        role:
          _eq: owner
