table:
  name: workflows
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
array_relationships:
  - name: steps
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_steps
          schema: public
  - name: triggers
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_triggers
          schema: public
  - name: runs
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_runs
          schema: public
select_permissions:
  - role: owner
    permission:
      columns:
        - id
        - org_id
        - name
        - description
        - created_at
        - updated_at
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: editor
    permission:
      columns:
        - id
        - org_id
        - name
        - description
        - created_at
        - updated_at
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns:
        - id
        - org_id
        - name
        - description
        - created_at
        - updated_at
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
insert_permissions:
  - role: owner
    permission:
      check:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
      columns:
        - org_id
        - name
        - description
  - role: editor
    permission:
      check:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
      columns:
        - org_id
        - name
        - description
update_permissions:
  - role: owner
    permission:
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
      columns:
        - name
        - description
        - updated_at
  - role: editor
    permission:
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
      columns:
        - name
        - description
        - updated_at
delete_permissions:
  - role: owner
    permission:
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: editor
    permission:
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
