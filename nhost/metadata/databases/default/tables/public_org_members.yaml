table:
  name: org_members
  schema: public
object_relationships:
- name: organization
  using:
    foreign_key_constraint_on: org_id
select_permissions:
- role: user
  permission:
    columns:
    - id
    - user_id
    - org_id
    - role
    - created_at
    filter:
      organization:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
insert_permissions:
- role: user
  permission:
    check:
      organization:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
          role:
            _eq: owner
    columns:
    - user_id
    - org_id
    - role
update_permissions:
- role: user
  permission:
    filter:
      organization:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
          role:
            _eq: owner
    columns:
    - role
delete_permissions:
- role: user
  permission:
    filter:
      organization:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
          role:
            _eq: owner
