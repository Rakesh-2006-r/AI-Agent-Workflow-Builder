table:
  name: workflow_steps
  schema: public
object_relationships:
- name: workflow
  using:
    foreign_key_constraint_on: workflow_id
select_permissions:
- role: user
  permission:
    columns:
    - id
    - workflow_id
    - type
    - config
    - step_order
    - created_at
    filter:
      workflow:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
insert_permissions:
- role: user
  permission:
    check:
      workflow:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
    columns:
    - workflow_id
    - type
    - config
    - step_order
update_permissions:
- role: user
  permission:
    filter:
      workflow:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
    columns:
    - type
    - config
    - step_order
delete_permissions:
- role: user
  permission:
    filter:
      workflow:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
